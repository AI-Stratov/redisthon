[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redisthon"
dynamic = ["version"]
description = "Telethon session storage in Redis or Dragonfly"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrew Istratov" },
]
keywords = ["telethon", "redis", "dragonfly", "session", "telegram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "telethon>=1.34.0",
    "redis[hiredis]>=5.0.0",
    "msgpack>=1.0.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "mypy>=2.4.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[project.urls]
Homepage = "https://github.com/AI-Stratov/redisthon"
Repository = "https://github.com/AI-Stratov/redisthon"
Issues = "https://github.com/AI-Stratov/redisthon/issues"
Documentation = "https://github.com/AI-Stratov/redisthon#readme"

[tool.hatch.version]
path = "redisthon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["redisthon"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ASYNC", "B", "C4", "PIE", "T20", "Q", "RUF",
    "PERF", "FURB", "G", "LOG", "SIM", "RET", "PT",
]
ignore = ["E501", "N806", "N803"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
pretty = true
show_error_codes = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "telethon.*",
    "msgpack",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
# Unit tests only by default. Integration tests need a server:
#   pytest tests/integration
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["redisthon"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
