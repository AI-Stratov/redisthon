[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redisthon"
version = "0.1.0"
description = "High-performance Redis/Dragonfly session storage for Telethon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Andrew Istratov" },
]
keywords = ["telethon", "redis", "dragonfly", "session", "telegram", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "telethon>=1.34.0",
    "redis[hiredis]>=5.0.0",
    "msgpack>=1.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "hatch>=1.12.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
    "memory-profiler>=0.60.0",
]

[project.urls]
Homepage = "https://github.com/AI-Stratov/redisthon"
Repository = "https://github.com/AI-Stratov/redisthon"
Issues = "https://github.com/AI-Stratov/redisthon/issues"
Documentation = "https://github.com/AI-Stratov/redisthon#readme"

[tool.hatch.build.targets.wheel]
packages = ["redisthon"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ASYNC", "B", "C4", "PIE", "T20", "Q", "RUF",
    "PERF", "FURB",
]
ignore = ["E501", "N806", "N803", "UP038"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
pretty = true
show_error_codes = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "telethon.*",
    "msgpack",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=redisthon",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "benchmark: performance benchmark tests",
    "integration: integration tests requiring Redis server",
    "slow: tests that take a long time to run",
]

[tool.coverage.run]
source = ["redisthon"]
omit = ["tests/*", "*/test_*.py"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
